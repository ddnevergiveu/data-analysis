[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analytics-portfolio"
version = "1.0.0"
description = "Reproducible Olist sales, RFM segmentation and cohort-retention analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[project.scripts]
olist-analyze = "olist_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["olist_analytics*"]
