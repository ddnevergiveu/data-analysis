name: Evidence Copilot

on:
  push:
    paths:
      - "projects/evidence-data-copilot/**"
      - ".github/workflows/evidence-copilot.yml"
  pull_request:
    paths:
      - "projects/evidence-data-copilot/**"
      - ".github/workflows/evidence-copilot.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/evidence-data-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/evidence-data-copilot/requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: evidence-copilot demo --db artifacts/ci-demo.duckdb
      - run: evidence-copilot ask "客户复购率是多少？" --db artifacts/ci-demo.duckdb --output artifacts/ci-answer.json
      - run: evidence-copilot verify --db artifacts/ci-demo.duckdb --answer artifacts/ci-answer.json
      - run: evidence-copilot evaluate --output artifacts/evaluation.json
